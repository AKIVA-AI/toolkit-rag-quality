name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - run: pip install -e ".[dev]"
    - run: pytest --cov=src --cov-report=xml -v
    - uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: pyright src/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install bandit pip-audit
    - name: Run bandit security scan
      run: bandit -r src/ -c pyproject.toml
    - name: Run pip-audit dependency scan
      run: pip install -e ".[dev]" && pip-audit

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - name: Install CycloneDX
      run: pip install cyclonedx-bom
    - name: Generate SBOM
      run: cyclonedx-py environment -o sbom.json --of json
    - uses: actions/upload-artifact@v4
      with:
        name: sbom
        path: sbom.json

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, typecheck, security]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install build
    - run: python -m build
