name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - run: pip install -e ".[dev]"
    - run: pytest --cov=src --cov-report=xml -v
    - uses: codecov/codecov-action@v7
      if: matrix.python-version == '3.11'
      with:
        fail_ci_if_error: false

  adapters:
    # The retriever adapter tests against real LangChain and LlamaIndex.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - run: pip install -e ".[dev,langchain,llamaindex]"
    - name: Adapter tests (no skips allowed)
      run: pytest tests/test_adapters.py -v -rs 2>&1 | tee adapters.log; test "${PIPESTATUS[0]}" -eq 0 && ! grep -q SKIPPED adapters.log
      shell: bash

  action:
    # Exercises the composite action in action.yml end to end.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build fixture reports
      run: |
        pip install .
        toolkit-rag score --queries tests/fixtures/action/qrels.trec --retrieved tests/fixtures/action/base.trec --out base.json
        toolkit-rag score --queries tests/fixtures/action/qrels.trec --retrieved tests/fixtures/action/worse.trec --out worse.json
    - name: Gate passes on an unchanged candidate
      id: same
      uses: ./
      with:
        baseline: base.json
        candidate: base.json
        report: same.json
    - name: Gate reports a regressed candidate (fail-on-regression false)
      id: regressed
      uses: ./
      with:
        baseline: base.json
        candidate: worse.json
        report: regressed.json
        fail-on-regression: 'false'
        budgets: |
          ndcg=1
          hit_rate=off
    - name: Gate fails the step on a regressed candidate
      id: failing
      continue-on-error: true
      uses: ./
      with:
        baseline: base.json
        candidate: worse.json
        report: failing.json
    - name: Gate with alpha passes a drop that is not significant (4 of 8 queries, p = 0.125)
      id: noisy
      uses: ./
      with:
        baseline: base.json
        candidate: worse.json
        report: noisy.json
        alpha: '0.05'
    - name: Check the action outputs
      env:
        SAME: ${{ steps.same.outputs.verdict }}
        REG_VERDICT: ${{ steps.regressed.outputs.verdict }}
        REG_CODE: ${{ steps.regressed.outputs.exit-code }}
        FAIL_OUTCOME: ${{ steps.failing.outcome }}
        NOISY: ${{ steps.noisy.outputs.verdict }}
      run: |
        set -eux
        test "$SAME" = pass
        test "$REG_VERDICT" = fail
        test "$REG_CODE" = 4
        test "$FAIL_OUTCOME" = failure
        test "$NOISY" = pass
        toolkit-rag validate-report --report regressed.json

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - run: pyright src/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Upgrade base packaging tools
      # The runner's preinstalled setuptools can carry advisories that are not
      # project dependencies; upgrade it so pip-audit reports on current tools.
      run: python -m pip install --upgrade pip setuptools
    - run: pip install bandit pip-audit
    - name: Run bandit security scan
      run: bandit -r src/ -c pyproject.toml
    - name: Run pip-audit dependency scan (all extras)
      # Audits what users can install, including the optional langchain and
      # llamaindex extras. Each ignored advisory is justified, with a re-check
      # date, under "Known advisories" in SECURITY.md.
      run: |
        pip install -e ".[dev,langchain,llamaindex]"
        pip-audit --ignore-vuln CVE-2026-81726

  sbom:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - run: pip install -e ".[dev]"
    - name: Install CycloneDX
      run: pip install cyclonedx-bom
    - name: Generate SBOM
      run: cyclonedx-py environment -o sbom.json --of json
    - uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.json

  build:
    name: Build and check package
    runs-on: ubuntu-latest
    needs: [test, adapters, action, lint, typecheck, security]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip build "twine>=6.1"
        python -m build
    - name: Check the metadata (twine 6.1+ reads Metadata 2.4)
      run: twine check --strict dist/*
    - name: Install the wheel in a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/venv/bin/toolkit-rag" --help > /dev/null
