[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-rag-quality"
version = "1.0.0"
description = "Retrieval regression testing in CI: trec_eval-equal metrics, per-query diffs, significance tests and leakage checks."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["rag", "retrieval", "evaluation", "qa", "leakage"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-rag-quality"
Documentation = "https://github.com/AKIVA-AI/toolkit-rag-quality#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-rag-quality"
Issues = "https://github.com/AKIVA-AI/toolkit-rag-quality/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-rag-quality/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-rag = "toolkit_rag_quality.cli:main"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.12"]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "jsonschema>=4.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["toolkit_rag_quality"]
omit = ["*/toolkit_rag_quality/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_rag_quality"]

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_rag_quality = ["py.typed"]
